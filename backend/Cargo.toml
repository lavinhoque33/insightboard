[package]
name = "insightboard-backend"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["InsightBoard Team"]
description = "A modular, cloud-native dashboard backend built with Rust and Axum"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
# fs and set-header: the release image serves the built frontend (M5 decision 1, ADR 0003).
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "fs", "set-header"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database. TLS (D21, M6 decision 5): rustls with the ring backend and the bundled webpki roots;
# `sslrootcert=` in DATABASE_URL adds a custom CA (for example the RDS bundle).
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json"] }

# Redis cache. `rediss://` uses rustls with the system roots (rustls-native-certs), so
# SSL_CERT_FILE can point at a custom CA bundle. No insecure-TLS feature (M6 decision 5).
redis = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp", "connection-manager"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication
jsonwebtoken = "9"
argon2 = "0.5"

# HTTP client for external APIs. rustls with the bundled webpki roots instead of the default
# native TLS (OpenSSL); charset and http2 are kept from the default features.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }

# Error handling
anyhow = "1.0"
thiserror = "1"

# Environment variables
dotenvy = "0.15"

# Tracing and logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# Rate limiting
governor = "0.6"

# Lambda entry point (M6 decision 3); compiled only with `--features lambda`.
lambda_http = { version = "1.3", optional = true, default-features = false, features = ["apigw_http"] }

[features]
# Switches the binary's entry point to AWS Lambda (Function URL / HTTP API payload v2).
lambda = ["dep:lambda_http"]

[dev-dependencies]
# Testing
mockito = "1.0"
# Contract tests (M4 decision 11). Default features off: no HTTP/file `$ref` resolution, so
# schema validation can never reach the network.
jsonschema = { version = "0.58", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Argon2 at the default cost is seconds per hash unoptimised; tests hash on every register.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
