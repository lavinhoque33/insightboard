services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: insightboard
            POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d insightboard']
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        environment:
            REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
        ports:
            - '127.0.0.1:6379:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
            interval: 10s
            timeout: 5s
            retries: 5
        command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}']

volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
