name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # Throwaway, CI-only values: the service containers live for this job and are
      # reachable only from the runner. They are not secrets.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: insightboard
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d insightboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://ci:ci-only-throwaway@127.0.0.1:5432/insightboard
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Reads rust-toolchain.toml (channel, rustfmt, clippy); installs exactly that toolchain.
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Backend check (fmt, clippy, test, build)
        run: make backend-check
      # M6 decision 12: the Lambda entry point (cargo feature `lambda`) is linted and tested too.
      - name: Clippy with the lambda feature
        working-directory: backend
        run: cargo clippy --locked --all-targets --features lambda -- -D warnings
      - name: Tests with the lambda feature
        working-directory: backend
        run: cargo test --locked --features lambda

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Web check (lint, test, build)
        run: make web-check

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # Same throwaway, CI-only service containers as the backend job; not secrets.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: insightboard
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d insightboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://ci:ci-only-throwaway@127.0.0.1:5432/insightboard
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      # Providers are the local fixture (playwright.config.ts); no keys, no live calls.
      - name: Playwright journeys
        run: make e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report
            frontend/e2e/test-results
          retention-days: 7

  # M6: Lambda package and synth-only infrastructure. No AWS credentials, secrets, or deploy:
  # the synth refuses to run if AWS credential variables are set.
  infra:
    name: infra
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Build the Lambda package (containers; nothing is uploaded)
        run: make lambda-build
      - name: Infra check (type-check, tests, synth with cdk-nag, cfn-lint)
        run: make infra-check

  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Generates a throwaway .env (random secrets, no provider keys) on this runner only;
      # it is never printed or uploaded.
      - name: Throwaway .env
        run: make setup-env
      - name: Build the release image (no push)
        run: make release
      - name: Start Postgres, Redis, and the app
        run: make up
      # No provider is called: only health, static, and dashboard routes on 127.0.0.1:8088.
      - name: Smoke checks
        shell: bash
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8088
          work="$(mktemp -d)"
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' backend/Cargo.toml)"

          echo "healthz reports version $version"
          curl -fsS "$base/healthz" | jq -e --arg v "$version" '.status == "ok" and .version == $v'

          echo "readyz is 200"
          curl -fsS -o /dev/null "$base/readyz"

          echo "/ serves index.html"
          curl -fsS -D "$work/root.h" -o "$work/root.html" "$base/"
          grep -qi '^content-type: text/html' "$work/root.h"
          grep -qi '^cache-control: no-cache' "$work/root.h"
          grep -q 'id="app"' "$work/root.html"

          echo "a deep link gets the SPA fallback"
          curl -fsS -D "$work/deep.h" -o "$work/deep.html" "$base/dashboards/some-id"
          grep -qi '^content-type: text/html' "$work/deep.h"
          cmp "$work/root.html" "$work/deep.html"

          echo "hashed assets are immutable"
          asset="$(grep -o '/assets/[^"]*\.js' "$work/root.html" | head -n 1)"
          curl -fsS -D "$work/asset.h" -o /dev/null "$base$asset"
          grep -qi '^cache-control: public, max-age=31536000, immutable' "$work/asset.h"
          grep -qi '^x-content-type-options: nosniff' "$work/asset.h"

          echo "/api/unknown is a JSON 404"
          result="$(curl -sS -o "$work/unknown.json" -w '%{http_code} %{content_type}' "$base/api/unknown")"
          test "$result" = "404 application/json"
          jq -e '.error | type == "string"' "$work/unknown.json"

          echo "register, create a dashboard, list it"
          email="ci-release-$(date +%s)-$RANDOM@example.com"
          token="$(curl -fsS -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"ci-release-smoke-password\"}" \
            "$base/api/auth/register" | jq -er .token)"
          curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"Release smoke"}' "$base/api/dashboards" | jq -e '.name == "Release smoke"'
          curl -fsS -H "Authorization: Bearer $token" "$base/api/dashboards" \
            | jq -e 'length == 1 and .[0].name == "Release smoke"'
      - name: App logs
        if: failure()
        run: docker compose --profile app logs --no-color app
      - name: Stop the stack
        if: always()
        run: make down
